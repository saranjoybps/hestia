services:
  - type: web
    name: joyhr-backend
    runtime: python
    env: python
    region: oregon
    plan: free
    branch: dev
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
    autoDeploy: true
